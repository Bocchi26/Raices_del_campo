<!-- login.component.html: Template del formulario de inicio de sesion -->
<div class="login-container">

    <h2>
        Iniciar sesión
    </h2>


    <form 
        [formGroup]="loginForm"
        (ngSubmit)="login()">


        <input
            type="email"
            placeholder="Correo electrónico"
            formControlName="email">


        <input
            type="password"
            placeholder="Contraseña"
            formControlName="password">


        <button 
            type="submit">

            Ingresar

        </button>


    </form>


    <p *ngIf="errorMensaje">
        {{ errorMensaje }}
    </p>


</div>
