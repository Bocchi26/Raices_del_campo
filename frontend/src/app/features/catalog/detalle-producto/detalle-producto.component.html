<!-- detalle-producto.component.html: Template de la ficha de detalle del producto -->
<div *ngIf="producto" class="detalle-container">
  <img [src]="producto.imagen" [alt]="producto.nombre">
  
  <h1>{{ producto.nombre }}</h1>
  <p>{{ producto.descripcion }}</p>
  <p><strong>Origen:</strong> {{ producto.origen }}</p>
  <p><strong>Unidad:</strong> {{ producto.unidadMedida }}</p>
  <p><strong>Precio:</strong> {{ producto.precio | currency:'COP':'symbol':'1.0-0' }}</p>
  <p><strong>Stock disponible:</strong> {{ producto.stock }}</p>

  <div class="selector">
    <label>Cantidad:</label>
    <input type="number" [(ngModel)]="cantidad" min="1" [max]="producto.stock">
  </div>

  <button (click)="agregarAlCarrito()" [disabled]="producto.stock === 0">
    Agregar al carrito
  </button>

  <p *ngIf="mensaje" class="alert">{{ mensaje }}</p>
</div>
